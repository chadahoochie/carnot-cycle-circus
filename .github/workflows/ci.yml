name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CarnotCycleCircus.slnx

      - name: Build Solution
        run: dotnet build CarnotCycleCircus.slnx --configuration Release --no-restore

      - name: Run Tests
        run: >-
          dotnet test CarnotCycleCircus.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Report Coverage
        id: coverage
        run: |
          report="$(find "${{ github.workspace }}/TestResults" -name 'coverage.cobertura.xml' | head -n 1)"
          if [ -z "$report" ]; then
            echo "No Cobertura coverage report was produced." >&2
            exit 1
          fi
          cp "$report" "${{ github.workspace }}/coverage.cobertura.xml"
          python3 scripts/coverage-summary.py "${{ github.workspace }}/coverage.cobertura.xml" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "path=${{ github.workspace }}/coverage.cobertura.xml" >> "$GITHUB_OUTPUT"

      - name: Archive Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cobertura
          path: ${{ github.workspace }}/coverage.cobertura.xml
          if-no-files-found: warn
