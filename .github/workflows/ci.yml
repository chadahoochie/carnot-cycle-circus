name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CarnotCycleCircus.slnx

      - name: Build Solution
        run: dotnet build CarnotCycleCircus.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test CarnotCycleCircus.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
