services:
  carnot-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: carnot-agent-server:latest
    container_name: carnot-agent-server
    ports:
      - "5000:5000"
    environment:
      - CARNOT_DATA_DIR=/carnot/data
      - CARNOT_ARTIFACTS_DIR=/carnot/artifacts
      - CARNOT_WORKSPACE_DIR=/workspace
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      # Mount 1: Persistent Server State (Keys, Memory, Tickets, Settings)
      - ${HOME}/.carnot/data:/carnot/data:rw
      # Mount 2: Persistent Artifacts (Generated Code, ADRs, Threat Models, QA reports)
      - ${HOME}/.carnot/artifacts:/carnot/artifacts:rw
      # Mount 3 (Optional): Target Workspace Repo on Host
      - ./workspace:/workspace:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
